<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatLab — ความน่าจะเป็นและสถิติ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
</head>
<body>

<div id="loader"><div class="spin"></div></div>

<header class="topbar">
  <button class="burger" id="burger" aria-label="เมนู">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="brand" href="#/">
    <span class="brand-mark">σ</span>
    <span class="brand-text">
      <strong>StatLab</strong>
      <small>SC 602 005 · ความน่าจะเป็นและสถิติ</small>
    </span>
  </a>
  <div class="topbar-right">
    <button class="icon-btn" id="fsBtn" title="ปรับขนาดตัวอักษร">
      <span class="a1">A</span><span class="a2">A</span>
    </button>
    <button class="icon-btn" id="searchBtn" title="ค้นหา (กด /)">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" title="สลับธีม">
      <svg viewBox="0 0 24 24" class="ic-moon"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      <svg viewBox="0 0 24 24" class="ic-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="prog-wrap">
        <div class="prog-head"><span>ความคืบหน้า</span><strong id="progPct">0%</strong></div>
        <div class="prog-bar"><i id="progFill"></i></div>
        <small id="progNote">ยังไม่เริ่มเรียน</small>
      </div>
      <button class="reset-btn" id="resetBtn">ล้างความคืบหน้า</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main"></main>
</div>

<div class="search-modal" id="searchModal">
  <div class="search-box">
    <div class="search-in">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="searchInput" placeholder="ค้นหาหัวข้อ สูตร หรือคำศัพท์…" autocomplete="off">
      <kbd>esc</kbd>
    </div>
    <div class="search-res" id="searchRes"></div>
  </div>
</div>

<script src="assets/js/stats.js"></script>
<script src="assets/js/content/course.js"></script>
<script src="assets/js/content/ch1.js"></script>
<script src="assets/js/content/ch2.js"></script>
<script src="assets/js/content/ch3.js"></script>
<script src="assets/js/content/ch4.js"></script>
<script src="assets/js/content/ch5.js"></script>
<script src="assets/js/content/ch6.js"></script>
<script src="assets/js/content/ch7.js"></script>
<script src="assets/js/content/exercises.js"></script>
<script src="assets/js/tools.js"></script>
<script src="assets/js/labs.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
